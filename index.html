<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alce Vertex</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #102018;
            color: #e8eee9;
        }

        /* =========================
           ESTRUTURA PRINCIPAL
           ========================= */

        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           BARRA LATERAL
           ========================= */

        .sidebar {
            width: 270px;
            background: #142a20;
            border-right: 1px solid #294536;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo {
            padding: 24px 22px 20px;
            border-bottom: 1px solid #294536;
        }

        .logo-title {
            font-size: 25px;
            font-weight: 700;
            margin: 0;
            color: #f0f5f1;
        }

        .logo-subtitle {
            font-size: 13px;
            color: #9db3a5;
            margin-top: 3px;
        }

        .sidebar-section {
            padding: 18px 12px 6px;
        }

        .section-title {
            padding: 0 10px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #789181;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar-button {
            width: 100%;
            border: none;
            background: transparent;
            padding: 9px 10px;
            border-radius: 6px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            color: #d6e2da;
        }

        .sidebar-button:hover {
            background: #1d392b;
        }

        .sidebar-button.active {
            background: #28543d;
            color: #ffffff;
            font-weight: 600;
        }

        .organization {
            padding-bottom: 15px;
        }

        .folder {
            margin-bottom: 3px;
        }

        .folder-header {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            border: none;
            background: transparent;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            color: #d6e2da;
        }

        .folder-header:hover {
            background: #1d392b;
        }

        .folder-arrow {
            width: 15px;
            font-size: 11px;
            color: #91a99a;
        }

        .folder-name {
            flex: 1;
        }

        .folder-content {
            padding-left: 24px;
        }

        .list-button {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            padding: 7px 10px;
            border-radius: 5px;
            text-align: left;
            font-size: 13px;
            color: #aebfb4;
            cursor: pointer;
        }

        .list-button:hover {
            background: #1d392b;
            color: #ffffff;
        }

        .sidebar-actions {
            margin-top: auto;
            border-top: 1px solid #294536;
            padding: 12px;
        }

        .action-button {
            width: 100%;
            border: none;
            background: transparent;
            padding: 8px 10px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            color: #aebfb4;
            font-size: 13px;
        }

        .action-button:hover {
            background: #1d392b;
            color: #ffffff;
        }

        /* =========================
           ÁREA PRINCIPAL
           ========================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #102018;
        }

        .topbar {
            height: 70px;
            background: #173024;
            border-bottom: 1px solid #294536;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 18px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            flex: 1;
            color: #edf3ef;
        }

        .search {
            width: 270px;
            padding: 9px 12px;
            border: 1px solid #3b5a49;
            background: #102018;
            color: #e8eee9;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .search::placeholder {
            color: #789181;
        }

        .search:focus {
            border-color: #628c73;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
        }

        .task-list {
            max-width: 900px;
        }

        .empty-message {
            padding: 40px 10px;
            color: #789181;
            font-size: 14px;
        }

        /* =========================
           TAREFAS
           ========================= */

        .task {
            background: #173024;
            border: 1px solid #294536;
            border-radius: 7px;
            margin-bottom: 8px;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .task:hover {
            border-color: #456b55;
            background: #193529;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #4f815f;
        }

        .task-body {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-size: 15px;
            font-weight: 500;
            color: #e8eee9;
        }

        .task-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 7px;
        }

        .task-tag {
            font-size: 11px;
            color: #a9bbaf;
            background: #203b2d;
            padding: 3px 7px;
            border-radius: 4px;
        }

        .task-date {
            font-size: 11px;
            color: #789181;
        }

        .completed .task-name {
            text-decoration: line-through;
            color: #71867a;
        }

        /* =========================
           MODAL
           ========================= */

        .modal-background {
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 5, 0.70);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-background.visible {
            display: flex;
        }

        .modal {
            width: 420px;
            max-width: calc(100vw - 30px);
            background: #173024;
            border: 1px solid #365744;
            border-radius: 9px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        }

        .modal h2 {
            margin: 0 0 18px;
            font-size: 19px;
            color: #edf3ef;
        }

        .modal label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aebfb4;
        }

        .modal input,
        .modal select {
            width: 100%;
            padding: 10px;
            border: 1px solid #3b5a49;
            background: #102018;
            color: #e8eee9;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .modal input:focus,
        .modal select:focus {
            outline: none;
            border-color: #628c73;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-button {
            border: 1px solid #3b5a49;
            background: #1d392b;
            color: #d6e2da;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal-button:hover {
            background: #28543d;
        }

        .modal-button.primary {
            background: #3d6b4c;
            color: white;
            border-color: #3d6b4c;
        }

        .modal-button.primary:hover {
            background: #4a7c5a;
        }

        /* =========================
           RESPONSIVO
           ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 220px;
            }

            .topbar {
                padding: 0 15px;
            }

            .content {
                padding: 18px 15px;
            }

            .search {
                width: 170px;
            }
        }

        @media (max-width: 520px) {

            .sidebar {
                width: 190px;
            }

            .search {
                width: 130px;
            }

            .page-title {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         BARRA LATERAL
         ========================= -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-title">Alce</div>
            <div class="logo-subtitle">Vertex</div>
        </div>

        <div class="sidebar-section">

            <div class="section-title">Tarefas</div>

            <button class="sidebar-button active" data-filter="all">
                Todas
            </button>

            <button class="sidebar-button" data-filter="today">
                Hoje
            </button>

            <button class="sidebar-button" data-filter="upcoming">
                Próximas
            </button>

            <button class="sidebar-button" data-filter="overdue">
                Atrasadas
            </button>

            <button class="sidebar-button" data-filter="completed">
                Concluídas
            </button>

        </div>

        <div class="sidebar-section organization">

            <div class="section-title">Organização</div>

            <div id="organizationTree"></div>

        </div>

        <div class="sidebar-actions">

            <button class="action-button" onclick="openModal('task')">
                + Nova tarefa
            </button>

            <button class="action-button" onclick="openModal('list')">
                + Nova lista
            </button>

            <button class="action-button" onclick="openModal('folder')">
                + Nova pasta
            </button>

            <button class="action-button">
                ⚙ Configurações
            </button>

        </div>

    </aside>


    <!-- =========================
         ÁREA PRINCIPAL
         ========================= -->

    <main class="main">

        <header class="topbar">

            <div class="page-title" id="pageTitle">
                Todas as tarefas
            </div>

            <input
                type="search"
                class="search"
                id="searchInput"
                placeholder="Pesquisar..."
            >

        </header>

        <section class="content">

            <div class="task-list" id="taskList"></div>

        </section>

    </main>

</div>


<!-- =========================
     MODAL
     ========================= -->

<div class="modal-background" id="modalBackground">

    <div class="modal">

        <h2 id="modalTitle">Nova tarefa</h2>

        <div id="modalContent"></div>

        <div class="modal-buttons">

            <button
                class="modal-button"
                onclick="closeModal()"
            >
                Cancelar
            </button>

            <button
                class="modal-button primary"
                onclick="saveModal()"
            >
                Criar
            </button>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       PERSISTÊNCIA LOCAL
       ===================================================== */

    const STORAGE_KEY = "alceVertexDataV1";


    /* =====================================================
       DADOS INICIAIS
       ===================================================== */

    const defaultFolders = [
        {
            id: 1,
            name: "Exemplo 1",
            open: true,
            lists: [
                { id: 1, name: "Exemplo 1" },
                { id: 2, name: "Exemplo 2" },
                { id: 3, name: "Exemplo 3" }
            ]
        },
        {
            id: 2,
            name: "Exemplo 2",
            open: true,
            lists: [
                { id: 4, name: "Exemplo 1" },
                { id: 5, name: "Exemplo 2" }
            ]
        },
        {
            id: 3,
            name: "Exemplo 3",
            open: false,
            lists: [
                { id: 6, name: "Exemplo 1" }
            ]
        }
    ];


    function dateString(date) {

        return date.toISOString().split("T")[0];

    }


    function today() {

        const date = new Date();

        return dateString(date);

    }


    function tomorrow() {

        const date = new Date();

        date.setDate(date.getDate() + 1);

        return dateString(date);

    }


    function yesterday() {

        const date = new Date();

        date.setDate(date.getDate() - 1);

        return dateString(date);

    }


    const defaultTasks = [
        {
            id: 1,
            name: "Exemplo 1",
            folderId: 1,
            listId: 1,
            completed: false,
            status: "Pendente",
            recurrence: "Única",
            recurrenceDays: null,
            date: today()
        },
        {
            id: 2,
            name: "Exemplo 2",
            folderId: 1,
            listId: 2,
            completed: false,
            status: "Pendente",
            recurrence: "Única",
            recurrenceDays: null,
            date: today()
        },
        {
            id: 3,
            name: "Exemplo 3",
            folderId: 2,
            listId: 4,
            completed: false,
            status: "Pendente",
            recurrence: "Única",
            recurrenceDays: null,
            date: tomorrow()
        },
        {
            id: 4,
            name: "Exemplo 4",
            folderId: 2,
            listId: 5,
            completed: false,
            status: "Pendente",
            recurrence: "Única",
            recurrenceDays: null,
            date: yesterday()
        },
        {
            id: 5,
            name: "Exemplo 5",
            folderId: 3,
            listId: 6,
            completed: true,
            status: "Concluída",
            recurrence: "Única",
            recurrenceDays: null,
            date: yesterday()
        }
    ];


    let folders;
    let tasks;


    /* =====================================================
       MIGRAÇÃO DOS DADOS ANTIGOS
       ===================================================== */

    function migrateTask(task) {

        if (!task.status) {

            task.status =
                task.completed
                    ? "Concluída"
                    : "Pendente";

        }


        if (!task.recurrence) {

            task.recurrence = "Única";

        }


        if (!Object.prototype.hasOwnProperty.call(
            task,
            "recurrenceDays"
        )) {

            task.recurrenceDays = null;

        }


        return task;

    }


    /* =====================================================
       CARREGAR / SALVAR DADOS
       ===================================================== */

    function loadData() {

        const savedData =
            localStorage.getItem(STORAGE_KEY);


        if (!savedData) {

            folders = defaultFolders;
            tasks = defaultTasks;

            saveData();

            return;

        }


        try {

            const data =
                JSON.parse(savedData);


            if (
                Array.isArray(data.folders) &&
                Array.isArray(data.tasks)
            ) {

                folders = data.folders;
                tasks = data.tasks.map(migrateTask);

                saveData();

            } else {

                folders = defaultFolders;
                tasks = defaultTasks;

            }

        } catch (error) {

            console.error(
                "Não foi possível carregar os dados do Vertex:",
                error
            );

            folders = defaultFolders;
            tasks = defaultTasks;

        }

    }


    function saveData() {

        const data = {

            folders: folders,

            tasks: tasks

        };


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    }


    /* =====================================================
       ESTADO DA INTERFACE
       ===================================================== */

    let currentFilter = "all";
    let currentFolderFilter = null;
    let currentListFilter = null;
    let currentModal = null;


    /* =====================================================
       FORMATAÇÃO DE DATAS
       ===================================================== */

    function formatDate(date) {

        if (!date) return "";

        const parts = date.split("-");

        return `${parts[2]}/${parts[1]}/${parts[0]}`;

    }


    /* =====================================================
       ÁRVORE DE ORGANIZAÇÃO
       ===================================================== */

    function renderOrganization() {

        const container =
            document.getElementById("organizationTree");

        container.innerHTML = "";


        folders.forEach(folder => {

            const folderElement =
                document.createElement("div");

            folderElement.className = "folder";


            const header =
                document.createElement("button");

            header.className = "folder-header";


            header.onclick = () => {

                folder.open = !folder.open;

                saveData();

                renderOrganization();

            };


            const arrow =
                folder.open ? "▼" : "▶";


            header.innerHTML = `
                <span class="folder-arrow">${arrow}</span>
                <span class="folder-name">${folder.name}</span>
            `;


            folderElement.appendChild(header);


            if (folder.open) {

                const content =
                    document.createElement("div");

                content.className = "folder-content";


                folder.lists.forEach(list => {

                    const button =
                        document.createElement("button");

                    button.className = "list-button";

                    button.textContent = list.name;


                    button.onclick = () => {

                        currentFilter = "list";
                        currentFolderFilter = folder.id;
                        currentListFilter = list.id;

                        updateActiveSidebar();


                        document.getElementById("pageTitle")
                            .textContent =
                            `${folder.name} / ${list.name}`;


                        renderTasks();

                    };


                    content.appendChild(button);

                });


                folderElement.appendChild(content);

            }


            container.appendChild(folderElement);

        });

    }


    /* =====================================================
       FILTROS
       ===================================================== */

    document.querySelectorAll(".sidebar-button")
        .forEach(button => {

            button.addEventListener("click", () => {

                currentFilter =
                    button.dataset.filter;

                currentFolderFilter = null;
                currentListFilter = null;

                updateActiveSidebar();


                const titles = {

                    all: "Todas as tarefas",

                    today: "Hoje",

                    upcoming: "Próximas",

                    overdue: "Atrasadas",

                    completed: "Concluídas"

                };


                document.getElementById("pageTitle")
                    .textContent =
                    titles[currentFilter];


                renderTasks();

            });

        });


    function updateActiveSidebar() {

        document.querySelectorAll(".sidebar-button")
            .forEach(button => {

                button.classList.remove("active");

            });


        if (currentFilter !== "list") {

            const button =
                document.querySelector(
                    `.sidebar-button[data-filter="${currentFilter}"]`
                );


            if (button) {

                button.classList.add("active");

            }

        }

    }


    /* =====================================================
       TAREFAS
       ===================================================== */

    function renderTasks() {

        const container =
            document.getElementById("taskList");


        const search =
            document.getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        let filtered = [...tasks];


        if (currentFilter === "all") {

            filtered =
                filtered.filter(
                    task => task.status !== "Concluída"
                );

        }


        else if (currentFilter === "today") {

            filtered =
                filtered.filter(task =>
                    task.status !== "Concluída" &&
                    task.date === today()
                );

        }


        else if (currentFilter === "upcoming") {

            filtered =
                filtered.filter(task =>
                    task.status !== "Concluída" &&
                    task.date > today()
                );

        }


        else if (currentFilter === "overdue") {

            filtered =
                filtered.filter(task =>
                    task.status !== "Concluída" &&
                    task.date < today()
                );

        }


        else if (currentFilter === "completed") {

            filtered =
                filtered.filter(
                    task => task.status === "Concluída"
                );

        }


        else if (currentFilter === "list") {

            filtered =
                filtered.filter(task =>
                    task.folderId === currentFolderFilter &&
                    task.listId === currentListFilter &&
                    task.status !== "Concluída"
                );

        }


        if (search) {

            filtered =
                filtered.filter(task =>
                    task.name
                        .toLowerCase()
                        .includes(search)
                );

        }


        container.innerHTML = "";


        if (filtered.length === 0) {

            container.innerHTML = `
                <div class="empty-message">
                    Nenhuma tarefa encontrada.
                </div>
            `;

            return;

        }


        filtered.forEach(task => {

            const element =
                document.createElement("div");


            element.className =
                "task" +
                (
                    task.status === "Concluída"
                        ? " completed"
                        : ""
                );


            const folder =
                folders.find(
                    folder => folder.id === task.folderId
                );


            const list =
                folder?.lists.find(
                    list => list.id === task.listId
                );


            element.innerHTML = `

                <input
                    type="checkbox"
                    class="task-checkbox"
                    ${
                        task.status === "Concluída"
                            ? "checked"
                            : ""
                    }
                >

                <div class="task-body">

                    <div class="task-name">
                        ${task.name}
                    </div>

                    <div class="task-meta">

                        <span class="task-tag">
                            ${folder ? folder.name : ""}
                        </span>

                        <span class="task-tag">
                            ${list ? list.name : ""}
                        </span>

                        <span class="task-tag">
                            ${task.status}
                        </span>

                        <span class="task-tag">
                            ${task.recurrence === "X dias"
                                ? `${task.recurrenceDays} dias`
                                : task.recurrence}
                        </span>

                        <span class="task-date">
                            ${formatDate(task.date)}
                        </span>

                    </div>

                </div>
            `;


            const checkbox =
                element.querySelector(".task-checkbox");


            checkbox.addEventListener("change", () => {

                task.status =
                    checkbox.checked
                        ? "Concluída"
                        : "Pendente";

                task.completed =
                    checkbox.checked;

                saveData();

                renderTasks();

            });


            container.appendChild(element);

        });

    }


    /* =====================================================
       PESQUISA
       ===================================================== */

    document.getElementById("searchInput")
        .addEventListener("input", renderTasks);


    /* =====================================================
       MODAL
       ===================================================== */

    function openModal(type) {

        currentModal = type;


        const background =
            document.getElementById("modalBackground");


        const title =
            document.getElementById("modalTitle");


        const content =
            document.getElementById("modalContent");


        if (type === "task") {

            title.textContent = "Nova tarefa";


            let options = "";


            folders.forEach(folder => {

                folder.lists.forEach(list => {

                    options += `
                        <option value="${folder.id}|${list.id}">
                            ${folder.name} / ${list.name}
                        </option>
                    `;

                });

            });


            content.innerHTML = `

                <label>Nome da tarefa</label>

                <input
                    id="modalTaskName"
                    type="text"
                    placeholder="Exemplo de tarefa"
                >

                <label>Lista</label>

                <select id="modalTaskList">
                    ${options}
                </select>

                <label>Status</label>

                <select id="modalTaskStatus">

                    <option value="Pendente">
                        Pendente
                    </option>

                    <option value="Projeto">
                        Projeto
                    </option>

                    <option value="Concluída">
                        Concluída
                    </option>

                </select>

                <label>Recorrência</label>

                <select
                    id="modalTaskRecurrence"
                    onchange="updateRecurrenceField()"
                >

                    <option value="Única">
                        Única
                    </option>

                    <option value="Semanal">
                        Semanal
                    </option>

                    <option value="Mensal">
                        Mensal
                    </option>

                    <option value="Anual">
                        Anual
                    </option>

                    <option value="X dias">
                        X dias
                    </option>

                </select>

                <div id="recurrenceDaysContainer"
                     style="display:none;">

                    <label>Intervalo em dias</label>

                    <input
                        id="modalRecurrenceDays"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="Exemplo: 15"
                    >

                </div>

                <label>Data</label>

                <input
                    id="modalTaskDate"
                    type="date"
                    value="${today()}"
                >

            `;

        }


        if (type === "list") {

            title.textContent = "Nova lista";


            let options = "";


            folders.forEach(folder => {

                options += `
                    <option value="${folder.id}">
                        ${folder.name}
                    </option>
                `;

            });


            content.innerHTML = `

                <label>Nome da lista</label>

                <input
                    id="modalListName"
                    type="text"
                    placeholder="Exemplo"
                >

                <label>Pasta</label>

                <select id="modalListFolder">
                    ${options}
                </select>

            `;

        }


        if (type === "folder") {

            title.textContent = "Nova pasta";


            content.innerHTML = `

                <label>Nome da pasta</label>

                <input
                    id="modalFolderName"
                    type="text"
                    placeholder="Exemplo"
                >

            `;

        }


        background.classList.add("visible");

    }


    /* =====================================================
       CAMPO DE RECORRÊNCIA "X DIAS"
       ===================================================== */

    function updateRecurrenceField() {

        const select =
            document.getElementById("modalTaskRecurrence");


        const container =
            document.getElementById(
                "recurrenceDaysContainer"
            );


        if (!select || !container) return;


        if (select.value === "X dias") {

            container.style.display = "block";

        } else {

            container.style.display = "none";

        }

    }


    function closeModal() {

        document.getElementById("modalBackground")
            .classList.remove("visible");

        currentModal = null;

    }


    /* =====================================================
       SALVAR MODAL
       ===================================================== */

    function saveModal() {

        if (currentModal === "folder") {

            const name =
                document.getElementById("modalFolderName")
                    .value
                    .trim();


            if (!name) return;


            folders.push({

                id: Date.now(),

                name: name,

                open: true,

                lists: []

            });

        }


        if (currentModal === "list") {

            const name =
                document.getElementById("modalListName")
                    .value
                    .trim();


            const folderId =
                Number(
                    document.getElementById("modalListFolder")
                        .value
                );


            if (!name) return;


            const folder =
                folders.find(
                    folder => folder.id === folderId
                );


            if (folder) {

                folder.lists.push({

                    id: Date.now(),

                    name: name

                });


                folder.open = true;

            }

        }


        if (currentModal === "task") {

            const name =
                document.getElementById("modalTaskName")
                    .value
                    .trim();


            const values =
                document.getElementById("modalTaskList")
                    .value
                    .split("|");


            const folderId =
                Number(values[0]);


            const listId =
                Number(values[1]);


            const date =
                document.getElementById("modalTaskDate")
                    .value;


            const status =
                document.getElementById("modalTaskStatus")
                    .value;


            const recurrence =
                document.getElementById("modalTaskRecurrence")
                    .value;


            let recurrenceDays = null;


            if (recurrence === "X dias") {

                recurrenceDays =
                    Number(
                        document.getElementById(
                            "modalRecurrenceDays"
                        ).value
                    );


                if (
                    !recurrenceDays ||
                    recurrenceDays < 1
                ) {

                    return;

                }

            }


            if (!name) return;


            tasks.push({

                id: Date.now(),

                name: name,

                folderId: folderId,

                listId: listId,

                completed:
                    status === "Concluída",

                status: status,

                recurrence: recurrence,

                recurrenceDays: recurrenceDays,

                date: date

            });

        }


        /* Salva imediatamente após qualquer alteração */

        saveData();


        closeModal();

        renderOrganization();

        renderTasks();

    }


    /* =====================================================
       INICIALIZAÇÃO
       ===================================================== */

    loadData();

    renderOrganization();

    renderTasks();

</script>

</body>
</html>
