<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alce Vertex</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #10251d;
        color: #e8eee9;
        height: 100vh;
        overflow: hidden;
    }

    .app {
        display: flex;
        height: 100vh;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
        width: 270px;
        background: #0b1b15;
        border-right: 1px solid #294538;
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
    }

    .brand {
        text-align: center;
        margin-bottom: 28px;
    }

    .brand-title {
        font-size: 30px;
        font-weight: bold;
        color: #d8e4dc;
        letter-spacing: 1px;
    }

    .brand-subtitle {
        margin-top: 3px;
        color: #8eab9b;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .sidebar-section {
        margin-bottom: 22px;
    }

    .sidebar-title {
        color: #718c7d;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1.5px;
        margin: 0 0 8px 10px;
        text-transform: uppercase;
    }

    .nav-item {
        width: 100%;
        border: 0;
        background: transparent;
        color: #b9c9c0;
        padding: 10px 12px;
        text-align: left;
        border-radius: 7px;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 2px;
    }

    .nav-item:hover {
        background: #19372b;
        color: #ffffff;
    }

    .nav-item.active {
        background: #214b39;
        color: #ffffff;
    }

    .folder {
        margin-bottom: 4px;
    }

    .folder-header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 4px 8px 9px;
        border-radius: 7px;
        cursor: pointer;
        color: #c6d4cc;
        font-size: 14px;
    }

    .folder-header:hover {
        background: #19372b;
    }

    .folder-arrow {
        width: 12px;
        color: #7e9a8a;
        font-size: 11px;
        flex-shrink: 0;
    }

    .folder-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .organization-menu-button {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        border: 0;
        background: transparent;
        color: #718c7d;
        border-radius: 5px;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 0;
    }

    .organization-menu-button:hover {
        background: #244638;
        color: #ffffff;
    }

    .folder-lists {
        margin-left: 24px;
        margin-top: 2px;
    }

    .list-row {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-bottom: 1px;
    }

    .list-item {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        color: #91a99c;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .list-item:hover {
        background: #19372b;
        color: #dce7e1;
    }

    .list-row .organization-menu-button {
        margin-right: 2px;
    }

    .standalone-list {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-bottom: 1px;
    }

    .standalone-list .list-item {
        padding-left: 9px;
    }

    .sidebar-bottom {
        margin-top: auto;
        padding-top: 15px;
        border-top: 1px solid #20392f;
    }

    .bottom-button {
        width: 100%;
        background: transparent;
        border: 0;
        color: #a9beb1;
        padding: 10px 12px;
        text-align: left;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 3px;
    }

    .bottom-button:hover {
        background: #19372b;
        color: #ffffff;
    }

    /* =========================
       MENU DE ORGANIZAÇÃO
       ========================= */

    .organization-menu {
        position: fixed;
        width: 165px;
        background: #10251d;
        border: 1px solid #3a594b;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        z-index: 50;
        padding: 5px;
    }

    .organization-menu button {
        width: 100%;
        border: 0;
        background: transparent;
        color: #c2d0c8;
        padding: 9px 10px;
        text-align: left;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
    }

    .organization-menu button:hover {
        background: #1c3a2d;
        color: #ffffff;
    }

    .organization-menu button.danger:hover {
        background: #422b2b;
        color: #f0c8c8;
    }

    /* =========================
       MAIN
       ========================= */

    .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        height: 68px;
        border-bottom: 1px solid #294538;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        flex-shrink: 0;
    }

    .page-title {
        font-size: 20px;
        font-weight: 600;
        color: #e3ebe6;
    }

    .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .view-button {
        border: 1px solid #365748;
        background: #142c22;
        color: #b9cbbf;
        border-radius: 7px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
    }

    .view-button:hover {
        background: #1b3a2d;
        color: #ffffff;
    }

    .content {
        flex: 1;
        overflow-y: auto;
        padding: 28px;
    }

    .tasks {
        max-width: 1000px;
        margin: 0 auto;
    }

    /* =========================
       TASK CARD
       ========================= */

    .task {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 13px;
        min-height: 64px;
        padding: 12px 14px;
        margin-bottom: 8px;
        background: #142c22;
        border: 1px solid #294538;
        border-radius: 9px;
        transition: background 0.15s, border-color 0.15s;
    }

    .task:hover {
        background: #19372b;
        border-color: #3a5b4b;
    }

    .task-checkbox {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        cursor: pointer;
        accent-color: #71957f;
    }

    .task-main {
        flex: 1;
        min-width: 0;
        cursor: pointer;
    }

    .task-name {
        color: #e3ebe6;
        font-size: 15px;
        line-height: 1.35;
        word-break: break-word;
    }

    .task.completed .task-name {
        color: #71887c;
        text-decoration: line-through;
    }

    .task-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
    }

    .task-description {
    margin-top: 16px;
    color: #9eb3a7;
    font-size: 13px;
    line-height: 1.4;
    }
   
    /* =========================
       ETIQUETAS
       ========================= */

    .tag {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .tag-status {
        border: 1px solid #526d5e;
        background: #1b3328;
        color: #bdd0c4;
        border-radius: 4px;
    }

    .tag-status.projeto {
        border-style: double;
        background: #26372e;
        color: #d0d4b9;
    }

    .tag-status.concluida {
        background: #1c2b24;
        border-color: #3c5146;
        color: #789184;
    }

    .tag-recurrence {
        border: 0;
        background: transparent;
        color: #91ae9e;
        padding-left: 2px;
        padding-right: 3px;
        letter-spacing: 0.4px;
    }

    .tag-recurrence::first-letter {
        font-size: 14px;
    }

    .task-date {
        color: #667f72;
        font-size: 11px;
        margin-left: 3px;
    }

    /* =========================
       TRÊS PONTOS
       ========================= */

    .task-menu-button {
        width: 32px;
        height: 36px;
        flex-shrink: 0;
        border: 0;
        background: transparent;
        color: #789286;
        border-radius: 6px;
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
        padding: 0;
    }

    .task-menu-button:hover {
        background: #244638;
        color: #ffffff;
    }

    .task-menu {
        position: absolute;
        right: 12px;
        top: 48px;
        width: 165px;
        background: #10251d;
        border: 1px solid #3a594b;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        z-index: 20;
        padding: 5px;
    }

    .task-menu button {
        width: 100%;
        border: 0;
        background: transparent;
        color: #c2d0c8;
        padding: 9px 10px;
        text-align: left;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
    }

    .task-menu button:hover {
        background: #1c3a2d;
        color: #ffffff;
    }

    .task-menu button.danger:hover {
        background: #422b2b;
        color: #f0c8c8;
    }

    /* =========================
       VIEW MENU
       ========================= */

    .view-menu-container {
        position: relative;
    }

    .view-menu {
        position: absolute;
        right: 0;
        top: 43px;
        width: 205px;
        background: #10251d;
        border: 1px solid #3a594b;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        z-index: 30;
        padding: 8px;
    }

    .view-menu-title {
        color: #718c7d;
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        padding: 5px 8px 8px;
    }

    .view-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 5px;
        cursor: pointer;
        color: #c2d0c8;
        font-size: 13px;
    }

    .view-option:hover {
        background: #1c3a2d;
    }

    .view-option input {
        accent-color: #71957f;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.58);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }

    .modal {
        width: min(520px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        background: #10251d;
        border: 1px solid #3b5b4c;
        border-radius: 11px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        padding: 24px;
    }

    .modal h2 {
        margin: 0 0 20px;
        color: #e4ece7;
        font-size: 19px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        color: #9eb3a7;
        font-size: 12px;
        margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        border: 1px solid #365748;
        background: #0c1e17;
        color: #dce7e1;
        border-radius: 6px;
        padding: 10px 11px;
        outline: none;
        font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #638675;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 22px;
    }

    .modal-button {
        border: 1px solid #3c5c4d;
        background: #183428;
        color: #c9d8cf;
        padding: 9px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
    }

    .modal-button:hover {
        background: #244638;
        color: #ffffff;
    }

    .modal-button.primary {
        background: #315d47;
        border-color: #4b755f;
        color: #ffffff;
    }

    .modal-button.primary:hover {
        background: #3d7056;
    }

    .hidden {
        display: none !important;
    }

    .empty {
        text-align: center;
        color: #71897b;
        padding: 60px 20px;
        font-size: 14px;
    }

    /* =========================
       RESPONSIVO
       ========================= */

    @media (max-width: 760px) {
        .sidebar {
            width: 220px;
        }

        .content {
            padding: 18px;
        }

        .topbar {
            padding: 0 18px;
        }
    }

    @media (max-width: 600px) {
        .sidebar {
            width: 190px;
            padding: 18px 12px;
        }

        .brand-title {
            font-size: 25px;
        }

        .topbar {
            height: 60px;
        }

        .page-title {
            font-size: 17px;
        }

        .task {
            padding: 11px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
         ========================= -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-title">Alce</div>
            <div class="brand-subtitle">Vertex</div>
        </div>

        <div class="sidebar-section">

            <div class="sidebar-title">Tarefas</div>

            <button class="nav-item active" data-view="all" onclick="changeView('all', this)">
                Todas
            </button>

            <button class="nav-item" data-view="today" onclick="changeView('today', this)">
                Hoje
            </button>

            <button class="nav-item" data-view="upcoming" onclick="changeView('upcoming', this)">
                Próximas
            </button>

            <button class="nav-item" data-view="overdue" onclick="changeView('overdue', this)">
                Atrasadas
            </button>

            <button class="nav-item" data-view="completed" onclick="changeView('completed', this)">
                Concluídas
            </button>

        </div>

        <div class="sidebar-section">

            <div class="sidebar-title">Organização</div>

            <div id="organization"></div>

        </div>

        <div class="sidebar-bottom">

            <button class="bottom-button" onclick="openNewTaskModal()">
                ＋ Nova tarefa
            </button>

            <button class="bottom-button" onclick="openNewListModal()">
                ＋ Nova lista
            </button>

            <button class="bottom-button" onclick="openNewFolderModal()">
                ＋ Nova pasta
            </button>

            <button class="bottom-button" onclick="showSettings()">
                ⚙ Configurações
            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN
         ========================= -->

    <main class="main">

        <header class="topbar">

            <div class="page-title" id="pageTitle">
                Todas
            </div>

            <div class="topbar-actions">

                <div class="view-menu-container">

                    <button class="view-button" onclick="toggleViewMenu()">
                        Visualização ▾
                    </button>

                    <div id="viewMenu" class="view-menu hidden">

                        <div class="view-menu-title">
                            Etiquetas visíveis
                        </div>

                        <label class="view-option">
                            <input
                                type="checkbox"
                                id="showStatus"
                                checked
                                onchange="changeVisibility('status', this.checked)"
                            >
                            Status
                        </label>

                        <label class="view-option">
                            <input
                                type="checkbox"
                                id="showRecurrence"
                                checked
                                onchange="changeVisibility('recurrence', this.checked)"
                            >
                            Recorrência
                        </label>

                        <label class="view-option">
                            <input
                                type="checkbox"
                                id="showDate"
                                checked
                                onchange="changeVisibility('date', this.checked)"
                            >
                            Data
                        </label>

                                               <label class="view-option">

                            <input
                                type="checkbox"
                                id="showDescription"
                                checked
                                onchange="changeVisibility('description', this.checked)"
                            >

                            Descrição

                        </label>   

                    </div>

                </div>

            </div>

        </header>

        <section class="content">
            <div class="tasks" id="tasks"></div>
        </section>

    </main>

</div>


<!-- =========================
     MODAL DE TAREFA
     ========================= -->

<div id="taskModal" class="modal-overlay hidden">

    <div class="modal">

        <h2 id="taskModalTitle">Nova tarefa</h2>

        <div class="form-group">

            <label for="modalTaskName">
                Nome da tarefa
            </label>

            <input
                id="modalTaskName"
                type="text"
                placeholder="Exemplo: Preparar relatório"
            >

        </div>

        <div class="form-group">

            <label for="modalTaskFolder">
                Pasta
            </label>

            <select
                id="modalTaskFolder"
                onchange="updateModalLists()"
            ></select>

        </div>

        <div class="form-group">

            <label for="modalTaskList">
                Lista
            </label>

            <select id="modalTaskList"></select>

        </div>

        <div class="form-group">

            <label for="modalTaskStatus">
                Status
            </label>

            <select id="modalTaskStatus">

                <option value="Pendente">
                    Pendente
                </option>

                <option value="Projeto">
                    Projeto
                </option>

                <option value="Concluída">
                    Concluída
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="modalTaskRecurrence">
                Recorrência
            </label>

            <select
                id="modalTaskRecurrence"
                onchange="updateRecurrenceField()"
            >

                <option value="Única">
                    Única
                </option>

                <option value="Diária">
                    Diária
                </option>

                <option value="Semanal">
                    Semanal
                </option>

                <option value="Mensal">
                    Mensal
                </option>

                <option value="Anual">
                    Anual
                </option>

                <option value="X dias">
                    X dias
                </option>

            </select>

        </div>

        <div
            id="recurrenceDaysContainer"
            class="form-group hidden"
        >

            <label for="modalRecurrenceDays">
                Intervalo em dias
            </label>

            <input
                id="modalRecurrenceDays"
                type="number"
                min="1"
                step="1"
                placeholder="Exemplo: 15"
            >

        </div>

        <div class="form-group">

            <label for="modalTaskDate">
                Data
            </label>

            <input
                id="modalTaskDate"
                type="date"
            >

        </div>

               <div class="form-group">

            <label for="modalTaskDescription">
                Descrição
            </label>

            <textarea
                id="modalTaskDescription"
                rows="4"
                placeholder="Escreva uma descrição para esta tarefa..."
            ></textarea>

        </div>

        <div class="modal-actions">

            <button
                class="modal-button"
                onclick="closeModal()"
            >
                Cancelar
            </button>

            <button
                class="modal-button primary"
                onclick="saveModal()"
            >
                Salvar
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   DADOS
   ========================================================= */

const STORAGE_KEY = "alceVertexDataV1";

let folders = [];
let tasks = [];
let standaloneLists = [];

let currentView = "all";
let currentListId = null;
let editingTaskId = null;

let visibility = {
    status: true,
    recurrence: true,
    date: true
};


/* =========================================================
   DATAS
   ========================================================= */

function formatDateInput(date) {

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function today() {
    return formatDateInput(new Date());
}


function tomorrow() {

    const d = new Date();

    d.setDate(d.getDate() + 1);

    return formatDateInput(d);
}


function yesterday() {

    const d = new Date();

    d.setDate(d.getDate() - 1);

    return formatDateInput(d);
}


/* =========================================================
   DADOS PADRÃO
   ========================================================= */

const defaultFolders = [

    {
        id: 1,
        name: "Exemplo 1",
        open: true,

        lists: [
            { id: 1, name: "Exemplo 1" },
            { id: 2, name: "Exemplo 2" },
            { id: 3, name: "Exemplo 3" }
        ]
    },

    {
        id: 2,
        name: "Exemplo 2",
        open: true,

        lists: [
            { id: 4, name: "Exemplo 1" },
            { id: 5, name: "Exemplo 2" }
        ]
    },

    {
        id: 3,
        name: "Exemplo 3",
        open: false,

        lists: [
            { id: 6, name: "Exemplo 1" }
        ]
    }

];


const defaultTasks = [

    {
        id: 1,
        name: "Exemplo 1",
        folderId: 1,
        listId: 1,
        completed: false,
        status: "Pendente",
        recurrence: "Única",
        recurrenceDays: null,
        date: today()
    },

    {
        id: 2,
        name: "Exemplo 2",
        folderId: 1,
        listId: 2,
        completed: false,
        status: "Pendente",
        recurrence: "Única",
        recurrenceDays: null,
        date: today()
    },

    {
        id: 3,
        name: "Exemplo 3",
        folderId: 2,
        listId: 4,
        completed: false,
        status: "Pendente",
        recurrence: "Única",
        recurrenceDays: null,
        date: tomorrow()
    },

    {
        id: 4,
        name: "Exemplo 4",
        folderId: 2,
        listId: 5,
        completed: false,
        status: "Pendente",
        recurrence: "Única",
        recurrenceDays: null,
        date: yesterday()
    },

    {
        id: 5,
        name: "Exemplo 5",
        folderId: 3,
        listId: 6,
        completed: true,
        status: "Concluída",
        recurrence: "Única",
        recurrenceDays: null,
        date: yesterday()
    }

];


/* =========================================================
   MIGRAÇÃO
   ========================================================= */

function migrateTask(task) {
  if (!task.status) {
    task.status = task.completed ? "Concluída" : "Pendente";
  }

  if (!task.recurrence) {
    task.recurrence = "Única";
  }

  if (!Object.prototype.hasOwnProperty.call(task, "recurrenceDays")) {
    task.recurrenceDays = null;
  }

  if (!Object.prototype.hasOwnProperty.call(task, "nextRecurrenceDate")) {
    task.nextRecurrenceDate = null;
  }

  return task;
}

function calculateNextRecurrenceDate(task, baseDate = null) {
  if (task.recurrence === "Única") {
    return null;
  }

  const base = baseDate
    ? new Date(baseDate + "T00:00:00")
    : new Date();

  if (isNaN(base.getTime())) {
    return null;
  }

  let next = new Date(base);

  if (task.recurrence === "Diária") {
    next.setDate(next.getDate() + 1);
  }

  else if (task.recurrence === "Semanal") {
    next.setDate(next.getDate() + 7);
  }

  else if (task.recurrence === "Mensal") {
    const day = next.getDate();
    next.setDate(1);
    next.setMonth(next.getMonth() + 1);

    const lastDay = new Date(
      next.getFullYear(),
      next.getMonth() + 1,
      0
    ).getDate();

    next.setDate(Math.min(day, lastDay));
  }

  else if (task.recurrence === "Anual") {
    const month = next.getMonth();
    const day = next.getDate();

    next.setDate(1);
    next.setFullYear(next.getFullYear() + 1);
    next.setMonth(month);

    const lastDay = new Date(
      next.getFullYear(),
      month + 1,
      0
    ).getDate();

    next.setDate(Math.min(day, lastDay));
  }

  else if (task.recurrence === "X dias") {
    const days = Number(task.recurrenceDays);

    if (!days || days < 1) {
      return null;
    }

    next.setDate(next.getDate() + days);
  }

  const year = next.getFullYear();
  const month = String(next.getMonth() + 1).padStart(2, "0");
  const day = String(next.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

   function processRecurrences() {

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    let changed = false;

    tasks.forEach(task => {

        if (
            task.status === "Concluída" &&
            task.recurrence !== "Única" &&
            task.nextRecurrenceDate &&
            task.nextRecurrenceDate <= today
        ) {

            task.status =
                "Pendente";

            task.completed =
                false;

            task.date =
                task.nextRecurrenceDate;

            task.nextRecurrenceDate =
                null;

            changed = true;
        }

    });

    if (changed) {
        saveData();
    }
}
   
/* =========================================================
   CARREGAR / SALVAR
   ========================================================= */

function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) {

        folders =
            JSON.parse(
                JSON.stringify(defaultFolders)
            );

        tasks =
            JSON.parse(
                JSON.stringify(defaultTasks)
            );

        standaloneLists = [];

        saveData();

        return;
    }

    try {

        const data =
            JSON.parse(saved);

        folders =
            data.folders ||
            JSON.parse(
                JSON.stringify(defaultFolders)
            );

        tasks =
            (
                data.tasks ||
                JSON.parse(
                    JSON.stringify(defaultTasks)
                )
            ).map(migrateTask);

        standaloneLists =
            data.standaloneLists || [];

        /*
         * Compatibilidade:
         * se a versão anterior ainda não possui
         * standaloneLists, criamos a estrutura.
         */

        if (!Array.isArray(standaloneLists)) {
            standaloneLists = [];
        }

        saveData();

    } catch (error) {

        console.error(
            "Erro ao carregar dados:",
            error
        );

        folders =
            JSON.parse(
                JSON.stringify(defaultFolders)
            );

        tasks =
            JSON.parse(
                JSON.stringify(defaultTasks)
            );

        standaloneLists = [];

        saveData();
    }
}


function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify({

            folders,
            standaloneLists,
            tasks

        })
    );
}


/* =========================================================
   LOCALIZAR LISTA
   ========================================================= */

function findList(listId) {

    for (const folder of folders) {

        const list =
            folder.lists.find(
                item => item.id === listId
            );

        if (list) {

            return {
                list,
                folder
            };
        }
    }

    const standalone =
        standaloneLists.find(
            item => item.id === listId
        );

    if (standalone) {

        return {
            list: standalone,
            folder: null
        };
    }

    return null;
}

                item.id === folderId
        );

    if (!folder) return;


    const newName =
        prompt(
            "Novo nome da pasta:",
            folder.name
        );


    if (
        newName === null ||
        !newName.trim()
    ) {
        return;
    }


    folder.name =
        newName.trim();


    saveData();

    renderOrganization();
}


/* =========================================================
   EXCLUIR PASTA
   ========================================================= */

function deleteFolder(folderId) {

    const folder =
        folders.find(
            item =>
                item.id === folderId
        );

    if (!folder) return;


    const lists =
        folder.lists || [];


    if (lists.length === 0) {

        const confirmed =
            confirm(
                `Excluir a pasta "${folder.name}"?`
            );

        if (!confirmed) return;


        folders =
            folders.filter(
                item =>
                    item.id !== folderId
            );

        saveData();

        renderOrganization();

        return;
    }


    const choice =
        prompt(

            `A pasta "${folder.name}" contém ${lists.length} lista(s).\n\n` +

            `Digite 1 para excluir a pasta E todas as suas listas e tarefas.\n\n` +

            `Digite 2 para excluir somente a pasta e deixar as listas sem pasta.\n\n` +

            `Digite 0 para cancelar.`

        );


    if (choice === "0" || choice === null) {
        return;
    }


    const listIds =
        lists.map(
            list => list.id
        );


    /* =========================
       EXCLUIR TUDO
       ========================= */

    if (choice === "1") {

        tasks =
            tasks.filter(
                task =>
                    !listIds.includes(
                        task.listId
                    )
            );

        folders =
            folders.filter(
                item =>
                    item.id !== folderId
            );


        if (
            currentView === "list" &&
            listIds.includes(
                currentListId
            )
        ) {

            currentView = "all";
            currentListId = null;

            document.getElementById(
                "pageTitle"
            ).textContent =
                "Todas";

            document
                .querySelectorAll(
                    ".nav-item"
                )
                .forEach(item =>
                    item.classList.remove(
                        "active"
                    )
                );

            const allButton =
                document.querySelector(
                    '.nav-item[data-view="all"]'
                );

            if (allButton) {
                allButton.classList.add(
                    "active"
                );
            }
        }


        saveData();

        renderOrganization();
        renderTasks();

        return;
    }


    /* =========================
       LIBERTAR LISTAS
       ========================= */

    if (choice === "2") {

        lists.forEach(list => {

            if (
                !standaloneLists.some(
                    item =>
                        item.id === list.id
                )
            ) {

                standaloneLists.push(
                    list
                );
            }
        });


        tasks.forEach(task => {

            if (
                task.folderId === folderId
            ) {

                task.folderId = null;
            }
        });


        folders =
            folders.filter(
                item =>
                    item.id !== folderId
            );


        saveData();

        renderOrganization();
        renderTasks();

        return;
    }


    alert(
        "Opção inválida. A pasta não foi alterada."
    );
}

/* =========================================================
   EXCLUIR LISTA
   ========================================================= */

function deleteList(listId) {

    const result =
        findList(listId);

    if (!result) return;


    const taskCount =
        tasks.filter(
            task =>
                task.listId === listId
        ).length;


    let message =
        `Excluir a lista "${result.list.name}"?`;


    if (taskCount > 0) {

        message +=
            `\n\nEsta lista possui ${taskCount} tarefa(s). Elas também serão excluídas.`;
    }


    const confirmed =
        confirm(message);


    if (!confirmed) return;


    if (result.folder) {

        result.folder.lists =
            result.folder.lists.filter(
                list =>
                    list.id !== listId
            );

    } else {

        standaloneLists =
            standaloneLists.filter(
                list =>
                    list.id !== listId
            );
    }


    tasks =
        tasks.filter(
            task =>
                task.listId !== listId
        );


    if (
        currentView === "list" &&
        currentListId === listId
    ) {

        currentView = "all";
        currentListId = null;


        document.getElementById(
            "pageTitle"
        ).textContent =
            "Todas";


        document
            .querySelectorAll(
                ".nav-item"
            )
            .forEach(item =>
                item.classList.remove(
                    "active"
                )
            );


        const allButton =

            );


        if (allButton) {

    saveData();

    renderOrganization();
    renderTasks();
}

/* =========================================================
   FILTRO DE TAREFAS
   ========================================================= */

function isToday(date) {

    return date === today();
}


function isUpcoming(date) {

    return date > today();
}


function isOverdue(date) {

    return date < today();
}


function getVisibleTasks() {

    let result = [];


    if (currentView === "all") {

    const activeTasks =
        tasks.filter(
            task =>
                task.status !==
                "Concluída"
        );

    const recurringCompletedTasks =
        tasks.filter(
            task =>
                task.status ===
                "Concluída" &&
                task.recurrence !==
                "Única"
        );

    result = [
        ...activeTasks,
        ...recurringCompletedTasks
    ];

} else if (
        currentView === "today"
    ) {

        result =
            tasks.filter(
                task =>
                    task.status !==
                        "Concluída" &&
                    isToday(task.date)
            );

    } else if (
        currentView === "upcoming"
    ) {

        result =
            tasks.filter(
                task =>
                    task.status !==
                        "Concluída" &&
                    isUpcoming(task.date)
            );

    } else if (
        currentView === "overdue"
    ) {

        result =
            tasks.filter(
                task =>
                    task.status !==
                        "Concluída" &&
                    isOverdue(task.date)
            );

    } else if (
        currentView === "completed"
    ) {

        result =
            tasks.filter(
                task =>
                    task.status ===
                    "Concluída"
            );

    } else if (
        currentView === "list"
    ) {

        result =
            tasks.filter(
                task =>
                    task.listId ===
                    currentListId
            );
    }


    return result;
}

        ) {

            const dateTag =
                document.createElement(
                    "span"
                );

            dateTag.className =
                "task-date";

            dateTag.textContent =
                formatDisplayDate(
                    task.date
                );


            meta.appendChild(
                dateTag
            );
        }


        taskMain.appendChild(
            meta
        );

        taskElement.appendChild(
            taskMain
        );


        /* Três pontos */

        const menuButton =
            document.createElement(
                "button"
            );

        menuButton.className =
            "task-menu-button";

        menuButton.textContent =
            "⋮";

        menuButton.title =
            "Ações da tarefa";


        menuButton.onclick =
            event => {

                event.stopPropagation();

                closeAllTaskMenus();

                const menu =
                    createTaskMenu(
                        task
                    );

                taskElement.appendChild(
                    menu
                );
            };


        taskElement.appendChild(
            menuButton
        );


        container.appendChild(
            taskElement
        );
    });
}


/* =========================================================
   DATA FORMATADA
   ========================================================= */

function formatDisplayDate(
    dateString
) {

    if (!dateString) {
        return "";
    }


    const parts =
        dateString.split("-");


    if (
        parts.length !== 3
    ) {

        return dateString;
    }


    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}


/* =========================================================
   ABRIR LISTA DA TAREFA
   ========================================================= */

function openTaskList(task) {

    openList(task.listId);
}


/* =========================================================
   MENU DA TAREFA
   ========================================================= */

function createTaskMenu(task) {

    const menu =
        document.createElement(
            "div"
        );

    menu.className =
        "task-menu";


    const editButton =
        document.createElement(
            "button"
        );

    editButton.textContent =
        "Editar";


    editButton.onclick =
        event => {

            event.stopPropagation();

            closeAllTaskMenus();

            openEditTaskModal(
                task.id
            );
        };


    menu.appendChild(
        editButton
    );


    const toggleButton =
        document.createElement(
            "button"
        );


    if (
        task.status ===
        "Concluída"
    ) {

        toggleButton.textContent =
            "Reabrir";

    } else {

        toggleButton.textContent =
            "Concluir";
    }


    toggleButton.onclick =
        event => {

            event.stopPropagation();


            if (
                task.status ===
                "Concluída"
            ) {

                task.status =
                    "Pendente";

                task.completed =
                    false;

            } else {

                task.status =
                    "Concluída";

                task.completed =
                    true;
            }


            saveData();

            renderTasks();
        };


        menu.appendChild(
        toggleButton
    );


    if (
        task.recurrence !==
        "Única"
    ) {

        const forceRecurrenceButton =
            document.createElement(
                "button"
            );

        forceRecurrenceButton.textContent =
            "Forçar recorrência";

        forceRecurrenceButton.onclick =
            event => {

                event.stopPropagation();

                task.status =
                    "Pendente";

                task.completed =
                    false;

                task.nextRecurrenceDate =
                    null;

                saveData();

                renderTasks();

                closeAllTaskMenus();
            };

        menu.appendChild(
            forceRecurrenceButton
        );
    }


    const deleteButton =
        document.createElement(
            "button"
        );
    deleteButton.className =
        "danger";

    deleteButton.textContent =
        "Excluir";


    deleteButton.onclick =
        event => {

            event.stopPropagation();

            deleteTask(
                task.id
            );
        };


    menu.appendChild(
        deleteButton
    );


    return menu;
}


function closeAllTaskMenus() {

    document
        .querySelectorAll(
            ".task-menu"
        )
        .forEach(menu =>
            menu.remove()
        );
}


/* =========================================================
   EXCLUIR TAREFA
   ========================================================= */

function deleteTask(taskId) {

    const task =
        tasks.find(
            item =>
                item.id === taskId
        );


    if (!task) return;


    const confirmed =
        confirm(
            `Excluir a tarefa "${task.name}"?`
        );


    if (!confirmed) return;


    tasks =
        tasks.filter(
            item =>
                item.id !== taskId
        );


    saveData();

    renderTasks();
}


/* =========================================================
   MODAL DE TAREFA
   ========================================================= */

function openNewTaskModal() {

    editingTaskId =
        null;


    document.getElementById(
        "taskModalTitle"
    ).textContent =
        "Nova tarefa";


    document.getElementById(
        "modalTaskName"
    ).value =
        "";


    populateFolderSelect();


    document.getElementById(
        "modalTaskStatus"
    ).value =
        "Pendente";


    document.getElementById(
        "modalTaskRecurrence"
    ).value =
        "Única";


    document.getElementById(
        "modalRecurrenceDays"
    ).value =
        "";


    document.getElementById(
        "modalTaskDate"
    ).value =
        today();


    updateRecurrenceField();


    document.getElementById(
        "taskModal"
    ).classList.remove(
        "hidden"
    );
}


function openEditTaskModal(
    taskId
) {

    const task =
        tasks.find(
            item =>
                item.id === taskId
        );


    if (!task) return;


    editingTaskId =
        taskId;


    document.getElementById(
        "taskModalTitle"
    ).textContent =
        "Editar tarefa";


    document.getElementById(
        "modalTaskName"
    ).value =
        task.name;


    populateFolderSelect();


    document.getElementById(
        "modalTaskFolder"
    ).value =
        task.folderId === null ||
        task.folderId === undefined
            ? ""
            : String(task.folderId);


    updateModalLists();


    document.getElementById(
        "modalTaskList"
    ).value =
        String(task.listId);


    document.getElementById(
        "modalTaskStatus"
    ).value =
        task.status;


    document.getElementById(
        "modalTaskRecurrence"
    ).value =
        task.recurrence;


    document.getElementById(
        "modalRecurrenceDays"
    ).value =
        task.recurrenceDays || "";


    document.getElementById(
        "modalTaskDate"
    ).value =
        task.date || today();


    updateRecurrenceField();


    document.getElementById(
        "taskModal"
    ).classList.remove(
        "hidden"
    );
}


function closeModal() {

    document
        .getElementById(
            "taskModal"
        )
        .classList.add(
            "hidden"
        );


    editingTaskId =
        null;
}


/* =========================================================
   FORMULÁRIO
   ========================================================= */

function populateFolderSelect() {

    const select =
        document.getElementById(
            "modalTaskFolder"
        );


    select.innerHTML = "";


    const standaloneOption =
        document.createElement(
            "option"
        );

    standaloneOption.value =
        "";

    standaloneOption.textContent =
        "Sem pasta";


    select.appendChild(
        standaloneOption
    );


    folders.forEach(folder => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            folder.id;

        option.textContent =
            folder.name;


        select.appendChild(
            option
        );
    });


    updateModalLists();
}


function updateModalLists() {

    const folderValue =
        document.getElementById(
            "modalTaskFolder"
        ).value;


    const select =
        document.getElementById(
            "modalTaskList"
        );


    select.innerHTML = "";


    let lists = [];


    if (folderValue === "") {

        lists =
            standaloneLists;

    } else {

        const folder =
            folders.find(
                item =>
                    item.id ===
                    Number(folderValue)
            );


        if (folder) {

            lists =
                folder.lists;
        }
    }


    lists.forEach(list => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            list.id;

        option.textContent =
            list.name;


        select.appendChild(
            option
        );
    });
}


function updateRecurrenceField() {

    const recurrence =
        document.getElementById(
            "modalTaskRecurrence"
        ).value;


    const container =
        document.getElementById(
            "recurrenceDaysContainer"
        );


    if (
        recurrence ===
        "X dias"
    ) {

        container.classList.remove(
            "hidden"
        );

    } else {

        container.classList.add(
            "hidden"
        );
    }
}


/* =========================================================
   SALVAR TAREFA
   ========================================================= */

function saveModal() {

    const name =
        document.getElementById(
            "modalTaskName"
        ).value.trim();

       const description =
        document.getElementById(
            "modalTaskDescription"
        ).value.trim();


    if (!name) {

        alert(
            "Digite o nome da tarefa."
        );

        return;
    }


    const folderValue =
        document.getElementById(
            "modalTaskFolder"
        ).value;


    const folderId =
        folderValue === ""
            ? null
            : Number(folderValue);


    const listId =
        Number(
            document.getElementById(
                "modalTaskList"
            ).value
        );


    if (!listId) {

        alert(
            "Selecione uma lista."
        );

        return;
    }


    const status =
        document.getElementById(
            "modalTaskStatus"
        ).value;


    const recurrence =
        document.getElementById(
            "modalTaskRecurrence"
        ).value;


    let recurrenceDays =
        null;


    if (
        recurrence ===
        "X dias"
    ) {

        recurrenceDays =
            Number(
                document.getElementById(
                    "modalRecurrenceDays"
                ).value
            );


        if (
            !recurrenceDays ||
            recurrenceDays < 1
        ) {

            alert(
                "Informe um intervalo válido em dias."
            );

            return;
        }
    }


    const date =
        document.getElementById(
            "modalTaskDate"
        ).value ||
        today();


    /* =========================
       EDIÇÃO
       ========================= */

    if (
        editingTaskId !== null
    ) {

        const task =
            tasks.find(
                item =>
                    item.id ===
                    editingTaskId
            );


        if (!task) return;


        task.name =
            name;

               task.description =
            description;

        task.folderId =
            folderId;

        task.listId =
            listId;

        task.status =
            status;

        task.completed =
            status ===
            "Concluída";

        task.recurrence =
            recurrence;

        task.recurrenceDays =
            recurrenceDays;

        task.date =
            date;

    }


    /* =========================
       NOVA TAREFA
       ========================= */

    else {

                tasks.push({

            id:
                Date.now(),

            name,

            description,

            folderId,

            listId,

            completed:
                status ===
                "Concluída",

            status,

            recurrence,

            recurrenceDays,

            date
        });
    }


    saveData();

    closeModal();

    renderOrganization();

    renderTasks();
}


/* =========================================================
   VISUALIZAÇÃO
   ========================================================= */

function toggleViewMenu() {

    document
        .getElementById(

        )
        .classList.toggle(

        );
}

) {

/* =========================================================
   NOVA LISTA
   ========================================================= */

function openNewListModal() {

    const name =
        prompt(
            "Nome da nova lista:"
        );


    if (
        !name ||
        !name.trim()
    ) {
        return;
    }


    const folderName =
        prompt(

            "Em qual pasta deseja criar a lista?\n\n" +
            "Digite o nome da pasta ou deixe vazio para criar a lista sem pasta."

        );


    /*
     * Lista sem pasta
     */

    if (
        folderName === null
    ) {
        return;
    }


    if (
        !folderName.trim()
    ) {

        standaloneLists.push({

            id: Date.now(),

            name:
                name.trim()
        });


        saveData();

        renderOrganization();

        return;
    }


    /*
     * Lista dentro de pasta
     */

    const folder =
        folders.find(
            item =>
                item.name.toLowerCase() ===
                folderName.trim().toLowerCase()
        );


    if (!folder) {

        alert(
            "Pasta não encontrada."
        );

        return;
    }


    const newListId =
        Date.now();


    folder.lists.push({

        id:
            newListId,

        name:
            name.trim()
    });


    folder.open =
        true;


    saveData();

    renderOrganization();
}


/* =========================================================
   NOVA PASTA
   ========================================================= */

function openNewFolderModal() {

    const name =
        prompt(
            "Nome da nova pasta:"
        );


    if (
        !name ||
        !name.trim()
    ) {
        return;
    }


    folders.push({

        id:
            Date.now(),

        name:
            name.trim(),

        open:
            true,

        lists:
            []
    });


    saveData();

    renderOrganization();
}

   CONFIGURAÇÕES

function showSettings() {

    alert(
        "As configurações do Vertex serão desenvolvidas em uma etapa posterior."
    );
}


/* =========================================================
   FECHAR MENUS AO CLICAR FORA
   ========================================================= */

document.addEventListener(
    "click",
    event => {

        const viewMenu =
            document.getElementById(
                "viewMenu"
            );


        const viewButton =
            event.target.closest(
                ".view-button"
            );


        if (
            !event.target.closest(
                ".view-menu"
            ) &&
            !viewButton
        ) {

            viewMenu.classList.add(
                "hidden"
            );
        }


        if (
            !event.target.closest(
                ".task-menu-button"
            )
        ) {

            closeAllTaskMenus();
        }


        if (
            !event.target.closest(
                ".organization-menu"
            ) &&
            !event.target.closest(
                ".organization-menu-button"
            )
        ) {

            closeOrganizationMenus();
        }
    }
);


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

loadData();

processRecurrences();

renderOrganization();

renderTasks();

</script>
